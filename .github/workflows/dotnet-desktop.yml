name: Build and Publish ScanSpectre (.NET 10 Release)

permissions:
  contents: write
  discussions: write

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./ScanSpectre.sln

    - name: Build (Release)
      run: dotnet build ./ScanSpectre.sln --configuration Release --no-restore

    - name: Publish Project
      run: |
        $publishDir = "C:\publish"
        dotnet publish ./ScanSpectre/ScanSpectre.csproj `
          --configuration Release `
          --output $publishDir `
          --self-contained false `
          --runtime win-x64
      shell: pwsh

    - name: Create Release ZIP
      run: |
        Compress-Archive -Path publish\* -DestinationPath publish\ScanSpectre.zip
      shell: pwsh

    # ----------------------------
    #        GIT TAGGING
    # ----------------------------

    - name: Create Git Tag
      id: tag_step
      shell: pwsh
      run: |
        $tag = "v" + (Get-Date -Format "yyyy.MM.dd.HHmmss")
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag $tag
        git push origin $tag
        echo "TAG=$tag" >> $env:GITHUB_ENV

    # ----------------------------
    #        CREATE RELEASE
    # ----------------------------

    - name: Create GitHub Release
      id: create_release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ env.TAG }}
        name: "ScanSpectre Release ${{ env.TAG }}"
        draft: false
        prerelease: false
        artifacts: "publish/ScanSpectre.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
