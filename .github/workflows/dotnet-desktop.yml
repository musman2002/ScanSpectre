name: Build and Publish ScanSpectre (.NET 10 Release)

permissions:
  contents: write
  discussions: write

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # ---------------------------
    # CHECKOUT
    # ---------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ---------------------------
    # .NET SDK
    # ---------------------------
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    # ---------------------------
    # CACHE
    # ---------------------------
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-

    # ---------------------------
    # RESTORE + BUILD
    # ---------------------------
    - name: Restore dependencies
      run: dotnet restore ./ScanSpectre.sln

    - name: Build (Release)
      run: dotnet build ./ScanSpectre.sln --configuration Release --no-restore

    # ---------------------------
    # PUBLISH (x64 + ARM64)
    # ---------------------------
    - name: Publish Project (x64)
      run: dotnet C:\publish ./ScanSpectre/ScanSpectre.csproj `
          --configuration Release `
          --output publish/x64 `
          --self-contained false `
          --runtime win-x64
      shell: pwsh

    - name: Publish Project (ARM64)
      run: dotnet publish ./ScanSpectre/ScanSpectre.csproj `
          --configuration Release `
          --output publish/arm64 `
          --self-contained false `
          --runtime win-arm64
      shell: pwsh

    # ---------------------------
    # CREATE ZIP RELEASE FILES
    # ---------------------------
    - name: Create ZIP archives
      run: |
        Compress-Archive -Path C:\publish/x64/* -DestinationPath C:\publish/ScanSpectre-x64.zip
        Compress-Archive -Path C:\publish/arm64/* -DestinationPath C:\publish/ScanSpectre-arm64.zip
      shell: pwsh

    # ---------------------------
    # SEMVER VERSIONING
    # ---------------------------
    - name: Auto increment version
      id: version
      run: |
        $current = (git tag --sort=-v:refname | Select-Object -First 1)
        if (-not $current) { $current = "v1.0.0" }

        $parts = $current.TrimStart("v").Split(".")
        $major = [int]$parts[0]
        $minor = [int]$parts[1]
        $patch = [int]$parts[2] + 1

        $newVersion = "v$major.$minor.$patch"
        echo "VERSION=$newVersion" >> $env:GITHUB_ENV
      shell: pwsh

    # ---------------------------
    # GIT TAGGING
    # ---------------------------
    - name: Create Git Tag
      shell: pwsh
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git tag $env:VERSION
        git push origin $env:VERSION

    # ---------------------------
    # CHANGELOG GENERATION
    # ---------------------------
    - name: Generate changelog
      id: changelog
      shell: pwsh
      run: |
        $log = git log -10 --pretty=format:"* %s (%h)" 
        echo "CHANGELOG=$log" >> $env:GITHUB_ENV

    # ---------------------------
    # CREATE RELEASE
    # ---------------------------
    - name: Create GitHub Release
      id: create_release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ env.VERSION }}
        name: "ScanSpectre Release ${{ env.VERSION }}"
        body: |
          ## Changes
          ${{ env.CHANGELOG }}

          ## Build Info
          - Architecture: x64 + ARM64
          - .NET Version: 10.0
          - Auto-generated by CI pipeline
        draft: false
        prerelease: false
        artifacts: |
          publish/ScanSpectre-x64.zip
          publish/ScanSpectre-arm64.zip
        token: ${{ secrets.GITHUB_TOKEN }}
