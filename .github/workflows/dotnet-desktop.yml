name: Build and Publish .NET Framework 4.8 Release

permissions:
  contents: write
  discussions: write

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v1.1.3

    - name: Restore NuGet packages

    - name: Build solution
      run: |
        $OutputDir = ".\Publish"
        New-Item -ItemType Directory -Force -Path $OutputDir
        msbuild /p:Configuration=Release .\ScanSpectre.sln /p:OutputPath=$OutputDir

    - name: Create a ZIP archive of the published files
      run: |
        Compress-Archive -Path .\Publish\* -DestinationPath .\Publish\release.zip
        
    - name: Create Git tag
      id: set_tag
      run: |
        $tag = "v$(Get-Date -Format 'yyyyMMddHHmmss')"
        git tag $tag
        git push origin $tag
        echo "TAG=$tag" >> $env:GITHUB_ENV

    - name: Create release
      id: create_release
      uses: ncipollo/release-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ env.TAG }}
        name: Release ${{ env.TAG }}
        draft: false
        prerelease: false
        artifacts: "./Publish/release.zip"
        artifactContentType: application/zip